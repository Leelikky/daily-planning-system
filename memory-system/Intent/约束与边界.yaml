## 时间与资源约束

constraints:
  time_limits: null
  resource_limits: null

## AI 行为复盘机制

ai_review:
  check_frequency: "每周日"
  file_path: "[你的项目路径]/ai-review/AI错误记录.md"
  action: "读取并反思本周问题，若发现重复错误则更新约束"

## 规划必问问题

# 每次做规划时，必须询问用户

planning_questions:
  - question: "这里面有你给自己设的锚点吗？"
    purpose: "识别重要不紧急的事"
  - question: "哪件事是你热爱/想长期积累的？"
    purpose: "提升自己事情的权重"
  - question: "这件事如果不做，一周后/一月后你会后悔吗？"
    purpose: "判断长期价值"

## 定期提醒

weekly_reminder:
  frequency: "每周复盘时"
  reminder: "本周有没有推进一件'重要不紧急'的事？"
  action: "如果没有，下周强制给自己设一个锚点"

## 更新日志

update_log: []
