## 三、主动输入轨道（Intent）：主动规划与约束

用于承载用户主动提出的目标、偏好与边界，避免短期需求与长期自我认知混淆：

- **目标与规划.yaml**：短期 / 长期目标、项目规划、自己设定的锚点
- **偏好与要求.yaml**：交互偏好、复盘流程偏好、内容风格要求
- **约束与边界.yaml**：决策红线、禁忌事项、规划必问问题

---

## 四、系统元数据（Meta）：迭代与复盘

- **洞察队列.yaml**：待沉淀的用户洞察、待确认的记忆点
- **框架演变.yaml**：记忆系统的版本迭代、设计变更记录
- **复盘记录/**：
  - **复盘模板.yaml**：周 / 月 / 季 / 年度复盘模板
  - **每日复盘模板.yaml**：每日复盘格式
  - **每周复盘模板.yaml**：每周复盘格式

---

## 五、层级关系图

```
L1 情境层（事件）
    │ 出现3次以上
    ↓
L2 行为层（怎么做）
    │ 多个行为有共同思维方式
    ↓
L3 认知层（怎么想）
    │ 多个思维模式有共同价值驱动
    ↓
L4 核心层（为什么）← 需用户确认
```

---

## 六、设计初衷与价值

1. **核心目标**：通过与 AI 的日常交互，抽象提炼个人的价值观、性格特征、心智模式、思维模式、工作习惯、行为偏好、决策原则等，让 AI 更好地协作，甚至模拟个人决策。

2. **动态更新**：基于对话自动沉淀 + 人工定期复盘，实现记忆系统的持续迭代。

3. **迁移价值**：记忆库可基于 IDE 工作台（如 Cursor、Claude Code 等）沉淀，实现跨 AI 应用的记忆迁移，不受单一平台限制。

4. **自我认知**：同时也是个人认知自我、了解自我的工具，帮助清晰看见自身的行为逻辑与核心信念。

---

## 七、人类记忆模型参考

本系统基于认知心理学设计：

| 心理学概念 | 对应层级 |
|------------|----------|
| 情节记忆 Episodic Memory | L1 情境层 |
| 程序性记忆 Procedural Memory | L2 行为层 |
| 语义记忆 Semantic Memory | L3 认知层 |
| 自我图式 Self-Schema | L4 核心层 |

**关键原理**：
- 人类记忆通过「重复强化」和「深层加工」实现长期存储
- 具体事件经过多次提取和反思，会抽象为一般性知识
- 自我图式是最稳定的认知结构，变化最慢
