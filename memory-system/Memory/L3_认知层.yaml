## 说明

本文件存储用户的思维模式和决策框架。

### 与 L2 的关系
- L2 记录"怎么做"（具体行为）
- L3 记录"怎么想"（思维模式）
- 一个 L3 思维模式可能对应多个 L2 行为

### 沉淀逻辑
```
观察多个 L2 行为
    ↓
发现共同思维方式
    ↓
提炼为 L3 思维模式
    ↓
分析背后的价值驱动
    ↓
建议更新 L4（需用户确认）
```
