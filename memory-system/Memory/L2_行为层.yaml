## 说明

本文件存储用户的行为模式和决策习惯。

### 与 L1 的关系
- L1 记录"发生了什么"（具体事件）
- L2 记录"怎么做"（行为模式）
- 同一行为在 L1 出现 3 次以上后沉淀到 L2

### 记录格式说明

```yaml
- habit: "行为名称"
  description: "行为描述"
  impact: "对决策/规划的影响"
  discovered_date: "发现日期"
  evidence: ["支撑证据1", "支撑证据2"]
```
