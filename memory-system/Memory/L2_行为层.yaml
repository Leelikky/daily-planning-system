type: Procedural Memory
description: Daily Plan 相关的行为模式与决策依据

## 存储内容

### 价值权重偏好

# 做优先级排序时的权重

priority_weights:
  - category: "自己设定的锚点"
    weight: 0.35
    notes: "重要不紧急的事，自己热爱的事"
  - category: "别人设定的锚点"
    weight: 0.25
    notes: "重要紧急的事，别人的期待"
  - category: "产出可见性"
    weight: 0.2
    notes: "能给完整结果的事"
  - category: "长期价值"
    weight: 0.2
    notes: "对能力体系、品牌建设有帮助的事"

